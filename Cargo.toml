[package]
name = "hullcaster"
version = "0.3.0"
authors = ["gilcu3"]
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal-based podcast manager to subscribe to and play podcasts with gpodder sync support."
keywords = ["podcast", "terminal", "TUI", "curses", "gpodder"]
categories = ["multimedia::audio", "command-line-interface"]

homepage = "https://github.com/gilcu3/hullcaster"
repository = "https://github.com/gilcu3/hullcaster"
documentation = "https://github.com/gilcu3/hullcaster"
readme = "README.md"

[features]
instrument = ["tokio/tracing", "console-subscriber"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.1"
chrono = "0.4.44"
clap = { version = "4.6.7", features = ["cargo", "env"] }
console-subscriber = { version = "0.5.0", optional = true }
derive_more = { version = "2.1.1", features = ["constructor"] }
dirs = { package = "dirs-next", version = "2.0.0" }
escaper = "0.1.1"
fs2 = "0.4.3"
gag = "1.0.0"
log = "0.4.35"
opml = "1.1.6"
ratatui = "0.30.2"
regex = "1.12.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "cookies",
  "query",
] }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "685e05765c2aff8fbb51e32cda5b18428d09ffbe", default-features = false, features = [
  "playback",
  "flac",
  "mp3",
  "mp4",
  "vorbis",
  "wav",
  "simd",
  "tracing",
  "symphonia-all",
  "symphonia-libopus",
] }
rss = "2.1.2"
rusqlite = "0.42.0"
sanitize-filename = "0.6.0"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
simplelog = { version = "0.12.2", features = ["local-offset"] }
souvlaki = "0.9.3"
stream-download = { version = "0.24.5", features = ["reqwest-rustls"] }
symphonia = { version = "0.6.1", features = ["mp3"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
toml = "1.2.1"
tui-input = "0.15.5"
unicode-segmentation = "1.13.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
winit = { version = "0.30.13", default-features = false }

[profile.reproducible]
inherits = "release"
debug = false
panic = "abort"
codegen-units = 1
overflow-checks = true

[lints.clippy]
panic = "deny"
panic_in_result_fn = "warn"
unwrap_used = "deny"

# Workaround for clippy on MacOS
future_not_send = "allow"

nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
wiremock = "0.6.5"
